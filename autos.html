<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>autos</title>
    <link rel="icon" type="image/png" href="autopartes.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

   
    <!-- BARRA SUPERIOR MÓVIL (Solo visible en pantallas pequeñas) -->
    <div class="mobile-navbar d-lg-none">
        <button class="btn btn-dark btn-toggle-menu" id="toggle-menu">☰</button>
        <span class="mobile-logo">Autos</span>
        <div class="cart-indicator-mobile" onclick="abrirCarrito()" style="cursor: pointer;">
            🛒 <span id="cart-count-mobile">0</span>
        </div>
    </div>

    <!-- OVERLAY PARA CERRAR EL MENÚ EN MÓVIL AL HACER CLIC FUERA -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- MENÚ / SIDEBAR PRINCIPAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
           
            <button class="btn-close-sidebar d-lg-none" id="close-menu">✕</button>
        </div>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="#" class="active" onclick="navegar('inicio', this)">🚘 Todos los Autos</a>
            
        </nav>

        <div class="d-flex align-items-center justify-content-center" style="width: auto; height: auto;">
          <img src="autopartes.png" alt="Autopartes Universal Logo" style="width: 300px; height: 200px; object-fit: contain;">
        </div>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">

          
        <header class="header-top d-none d-lg-flex">
            <h2 id="categoria-titulo">🚘 Catálogo de Autos y Vehículos</h2>
            <div class="cart-indicator" onclick="abrirCarrito()" style="cursor: pointer;">
                🛒 Carrito: <span id="cart-count">0</span> items
            </div>
            
        </header>

        <!-- CONTENEDOR DE TARJETAS HORIZONTALES -->
        <div class="container-fluid mt-3 mt-lg-4 px-2 px-sm-3">
        <div class="row g-3 g-lg-4" id="productos-container" data-tipo="autos"></div>
            <h3 class="d-lg-none mb-3 text-center fs-4">🚘 Catálogo de Autos</h3>
            
            <!-- Vista principal de productos -->
            <div id="vista-inicio">
                <div class="row g-3 g-lg-4" id="productos-container">
                    <!-- Se genera dinámicamente con renderizarProductosEstaticos() en App.js -->
                </div>
            </div>

            <!-- Vista secundaria para filtrar por categorías (Sedanes, SUVs, etc.) -->
            <div id="vista-categoria" style="display: none;">
                <div class="row g-3 g-lg-4" id="grid-categoria">
                    <!-- Se genera dinámicamente desde App.js al hacer clic en el sidebar -->
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DEL CARRITO Y PAGO BANCARIO -->
    <div id="modal-carrito" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1050; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            
            <div class="d-flex justify-content-between align-items-center pb-2 border-bottom">
                <h3 class="m-0">🛒 Mi Carrito</h3>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" onclick="vaciarCarrito()" class="btn btn-sm btn-outline-danger">Vaciar Carrito</button>
                    <button type="button" class="btn-close" onclick="cerrarModal('modal-carrito')"></button>
                </div>
            </div>
            
            <!-- Contenedor de items cargados -->
            <div id="cart-items-container" class="my-3"></div>
            
            <h4 class="text-end fw-bold mb-3">Total: $<span id="cart-total">0.00</span> MXN</h4>
            
            <hr class="my-3">

            <!-- FORMULARIO BANCARIO COMPLETO -->
            <h4 class="mb-3">💳 Proceso Bancario</h4>
            <form onsubmit="procesarPago(event)">
                <div class="mb-2">
                    <label class="form-label mb-1" style="font-size:0.9rem;">Nombre en la tarjeta:</label>
                    <input type="text" id="pago-nombre" class="form-control" required placeholder="Juan Pérez">
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1" style="font-size:0.9rem;">Número de Tarjeta (16 dígitos):</label>
                    <input type="text" id="pago-tarjeta" class="form-control" maxlength="16" required placeholder="1234567890123456">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label mb-1" style="font-size:0.9rem;">Vencimiento:</label>
                        <input type="text" class="form-control" placeholder="MM/AA" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label mb-1" style="font-size:0.9rem;">CVV:</label>
                        <input type="password" class="form-control" maxlength="3" required placeholder="123">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary flex-fill" onclick="cerrarModal('modal-carrito')">Cancelar</button>
                    <button type="submit" class="btn btn-success flex-fill fw-bold">Pagar y Generar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DEL TICKET FINAL -->
    <div id="modal-ticket" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1060; align-items: center; justify-content: center;">
        <div class="modal-content" style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; text-align: center;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 text-success">✅ Transacción Exitosa</h4>
                <button type="button" class="btn-close" onclick="cerrarModal('modal-ticket')"></button>
            </div>
            
            <div id="ticket-contenido" class="ticket-box text-start p-3 bg-light rounded border mb-3"></div>
            
            <div class="d-flex gap-2">
                <button type="button" onclick="window.print()" class="btn btn-indigo flex-fill text-white" style="background-color: #6366f1;">🖨️ Descargar / Imprimir</button>
                <button type="button" onclick="cerrarModal('modal-ticket')" class="btn btn-secondary flex-fill">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- JavaScript local y lógica del carrito -->
    <script src="index.js"></script>
</body>
</html>
