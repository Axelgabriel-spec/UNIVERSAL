<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador - UNIVERSAL</title>
    <link rel="icon" type="image/png" href="autopartes.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 70px; /* Espacio para compensar el navbar fijo */
        }
        
        /* BANNER HORIZONTAL DE NAVEGACIÓN */
        .navbar-top {
            background-color: #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        
        .search-banner {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            padding: 40px 15px;
            border-radius: 0 0 20px 20px;
        }
        
        .card-refaccionaria {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background: white;
        }
        
        .card-refaccionaria:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }
        
        .badge-tag {
            background-color: #e2e8f0;
            color: #334155;
            font-size: 0.75rem;
            margin-right: 4px;
            margin-bottom: 4px;
            display: inline-block;
        }

        .info-item {
            font-size: 0.85rem;
            color: #475569;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN HORIZONTAL (BANNER TOP) -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-top fixed-top px-3">
        <div class="container-fluid">
            <!-- LOGO Y MARCA -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-info" href="index.html">
                <img src="autopartes.png" alt="Logo" style="height: 35px; width: auto; object-fit: contain;">
                <span>UNIVERSAL</span>
            </a>

            <!-- BOTÓN HAMBURGUESA PARA MÓVILES -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarUniversal" aria-controls="navbarUniversal" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- MENÚ HORIZONTAL DE ENLACES -->
            <div class="collapse navbar-collapse" id="navbarUniversal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Inicio</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ÁREA PRINCIPAL -->
    <main class="w-100 p-0">
        <!-- BANNER DE BÚSQUEDA -->
        <header class="search-banner text-center mb-4">
            <div class="container" style="max-width: 700px;">
                <h1 class="fw-bold mb-2">🔍 Directorio de Refaccionarias</h1>
                <p class="text-light opacity-75 mb-4">Encuentra proveedores y tiendas automotrices cerca de ti por nombre, marca o refacción.</p>
                
                <div class="input-group input-group-lg shadow-sm">
                    <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="input-busqueda" class="form-control border-0 fs-6" placeholder="Busca 'AutoZone', 'Frenos', 'CDMX', 'Nissan'..." onkeyup="filtrarRefaccionarias()">
                    <button class="btn btn-warning fw-bold px-4" type="button" onclick="filtrarRefaccionarias()">Buscar</button>
                </div>
            </div>
        </header>

        <!-- RESULTADOS Y GRID DE TARJETAS DIRECTAS -->
        <section class="container mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="m-0 fw-bold text-secondary" id="contador-resultados">Mostrando refaccionarias</h5>
            </div>

            <div class="row g-4" id="contenedor-cards">
                <!-- Las tarjetas se generan dinámicamente con la información completa visible -->
            </div>
        </section>
    </main>

    <!-- Bootstrap 5 JS Bundle y App.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="App.js"></script>

    <!-- LÓGICA DEL BUSCADOR -->
    <script>
        const directorioRefaccionarias = [
            {
                id: 1,
                nombre: "AutoZone México",
                logotipo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGkPdR-QsHM9nYj4Ur6Tj-8Ehy92t0BfuD0ViTVhftGG3n3RIClfxrMlA&s=10",
                descripcion: "Cadena líder en venta de autopartes, accesorios, baterías y herramientas con diagnóstico gratuito.",
                ubicación: "calle de la rosa # 30, col. las margaritas chilpancingo, GRO 39014",
                telefono: "(747) 472-0445",
                horario: "Lunes 8:00 AM - 9:00 PM, Martes 8:00 AM - 9:00 PM, Miércoles 8:00 AM - 9:00 PM, Jueves 8:00 AM - 9:00 PM, Viernes 8:00 AM - 9:00 PM, Sábado 8:00 AM - 9:00 PM, Domingo 8:00 AM - 9:00 PM",
                web: "https://www.autozone.com.mx",
                keywords: ["autozone", "baterias", "aceite", "scanner", "herramientas", "nacional", "accesorios", "refacciones generales", "frenos"]
            },
            {
                id: 2,
                nombre: "Refaccionaria California",
                logotipo: "https://www.refaccionariacalifornia.com.mx/on/demandware.static/Sites-RefaccionariaCalifornia-Site/-/default/dwbd9a14b1/images/brand/rc-logo.svg",
                descripcion: "Especialistas en suspensión, dirección, frenos y partes de motor para marcas nacionales e importadas.",
                ubicación: "CDMX y Área Metropolitana",
                telefono: "55 2595 3068 Whatsapp: 55 2595 3068",
                horario: "Lunes a Viernes: 9:00 AM - 6:30 PM Sábados 8:00 - 14:00 hrs Domingos y Días Festivos 9:00 - 14:00 hrs",
                web: "https://www.refaccionariacalifornia.com.mx",
                keywords: ["california", "cdmx", "suspension", "amortiguadores", "frenos", "motor", "estado de mexico", "vws", "chevy"]
            },
            {
                id: 3,
                nombre: "Chrysler Chilpancingo ",
                logotipo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLJ8UD_CsXSNCprz2OoHuR_N0M4-e5JhIqr2cBzHOwbYEx1Iy-Uytx0VE&s=10",
                descripcion: "Distribuidor mayorista de autopartes eléctricas, marchas, alternadores y sensores de inyección electrónica.",
                ubicación: "Chilpancingo de los bravo Guerrero",
                telefono: "747 478 3155",
                horario: "Ventas: Lunes a Viernes 8:30 a.m. - 7:00 p.m. Sábados 8:30 a.m. - 2:00 p.m. Refacciones: Lunes a Viernes 8:30 a.m. - 6:00 p.m. Sábados 8:30 a.m. - 2:00 p.m. Servicio: Lunes a Viernes 8:30 a.m. - 7:00 p.m. Sábados 8:30 a.m. - 2:00 p.m.",
                web: "https://chryslerchilpancingo.com.mx",
                keywords: ["Crysler", "Chilpancingo", "Guerrero", "Ventas", "Servicio", "Refacciones", "Seminuevo"]
            },
            {
                id: 4,
                nombre: "Rolcar Autopartes",
                logotipo: "https://www.rolcar.com/wp-content/uploads/2023/01/cropped-logo_rolcar.jpg",
                descripcion: "Venta de refacciones mecánicas, colisión y mantenimiento preventivo para flotillas y autos particulares.",
                ubicación: "Aguascalientes",
                telefono: "+52 449 910-9040",
                horario: "Lunes a viernes: 08:00 – 20:00 hrs Sábados: 08:00 – 18:30 hrs Domingos: 09:30 – 14:30 hrs",
                web: "https://www.rolcar.com.mx",
                keywords: ["rolcar", "Aguascalientes", "calientes", "colision", "flotillas", "aceites", "filtros"]
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderizarTarjetas(directorioRefaccionarias);
        });

        function filtrarRefaccionarias() {
            const texto = document.getElementById('input-busqueda').value.toLowerCase().trim();

            if (texto === "") {
                renderizarTarjetas(directorioRefaccionarias);
                return;
            }

            const resultados = directorioRefaccionarias.filter(item => {
                const coincideNombre = item.nombre.toLowerCase().includes(texto);
                const coincideUbicacion = item.ubicación.toLowerCase().includes(texto);
                const coincideKeywords = item.keywords.some(kw => kw.toLowerCase().includes(texto));

                return coincideNombre || coincideUbicacion || coincideKeywords;
            });

            renderizarTarjetas(resultados);
        }

        function renderizarTarjetas(lista) {
            const contenedor = document.getElementById('contenedor-cards');
            const contador = document.getElementById('contador-resultados');
            if (!contenedor) return;
            
            contenedor.innerHTML = "";
            if (contador) contador.innerText = `Mostrando ${lista.length} refaccionaria(s)`;

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="bi bi-exclamation-circle text-muted fs-1"></i>
                        <p class="mt-2 text-muted">No encontramos refaccionarias que coincidan con tu búsqueda.</p>
                    </div>
                `;
                return;
            }

            lista.forEach(ref => {
                const tagsHTML = ref.keywords.map(kw => `<span class="badge badge-tag">${kw}</span>`).join('');

                const col = document.createElement('div');
                col.className = 'col-12 col-md-6 col-lg-4';
                col.innerHTML = `
                    <div class="card card-refaccionaria h-100 p-3 d-flex flex-column justify-content-between">
                        <div>
                            <!-- ENCABEZADO CON LOGO Y NOMBRE -->
                            <div class="d-flex align-items-center gap-3 mb-3 border-bottom pb-2">
                                <img src="${ref.logotipo}" alt="${ref.nombre}" style="width: 55px; height: 55px; object-fit: contain;">
                                <div>
                                    <h5 class="fw-bold m-0 fs-6 text-dark">${ref.nombre}</h5>
                                </div>
                            </div>

                            <!-- DESCRIPCIÓN -->
                            <p class="small text-secondary mb-3">${ref.descripcion}</p>

                            <!-- DETALLES VISIBLES DIRECTOS -->
                            <div class="info-item mb-1">
                                <i class="bi bi-geo-alt-fill text-danger me-1"></i> <strong>Ubicación:</strong> ${ref.ubicación}
                            </div>
                            <div class="info-item mb-1">
                                <i class="bi bi-telephone-fill text-primary me-1"></i> <strong>Teléfono:</strong> ${ref.telefono}
                            </div>
                            <div class="info-item mb-3">
                                <i class="bi bi-clock-fill text-warning me-1"></i> <strong>Horario:</strong> ${ref.horario}
                            </div>

                            <!-- PALABRAS CLAVE -->
                            <div class="mb-3">${tagsHTML}</div>
                        </div>

                        <!-- BOTÓN DIRECTO A LA WEB OFICIAL -->
                        <a href="${ref.web}" target="_blank" class="btn btn-primary btn-sm w-100 fw-bold">
                            🌐 Ir a la Página Web Oficial <i class="bi bi-box-arrow-up-right ms-1"></i>
                        </a>
                    </div>
                `;
                contenedor.appendChild(col);
            });
        }
    </script>
</body>
</html>
