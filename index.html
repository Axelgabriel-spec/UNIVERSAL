 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> UNIVERSAL</title>
    <link rel="icon" type="image/png" href="autopartes.png">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>

   

    <!-- BARRA SUPERIOR MÓVIL -->
    <div class="mobile-navbar d-lg-none">
        <button class="btn btn-dark btn-toggle-menu" id="toggle-menu" onclick="toggleMenu()">☰</button>
        <span class="mobile-logo">UNIVERSAL</span>
        <!-- BOTÓN DE CARRITO MÓVIL ESTILIZADO -->
        <button type="button" class="btn btn-warning rounded-pill px-3 py-1 fw-bold shadow-sm" onclick="abrirCarrito()">
            🛒 <span id="cart-count-mobile">0</span>
        </button>
    </div>

    <!-- OVERLAY MÓVIL -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>

    <!-- MENÚ / SIDEBAR PRINCIPAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center">
            <h2>UNIVERSAL</h2>
            <button class="btn-close-sidebar d-lg-none" id="close-menu" onclick="toggleMenu()">✕</button>
        </div>
        <nav>
            <a href="index.html" class="active">Inicio</a>
            <a href="refacciones.html">Refacciones</a>
            <a href="autos.html">Autos</a>
            <a href="accesorios.html">Accesorios</a>
        </nav>

        <div class="d-flex align-items-center justify-content-center" style="width: auto; height: auto;">
          <img src="autopartes.png" alt="Autopartes Universal Logo" style="width: 300px; height: 200px; object-fit: contain;">
        </div>


    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <header class="header-top d-none d-lg-flex align-items-center justify-content-between">
            <h2 id="categoria-titulo" class="m-0">Promociones y Novedades</h2>
            <!-- BOTÓN DE CARRITO DESKTOP ESTILIZADO -->
            <button type="button" class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm" onclick="abrirCarrito()">
                🛒 Carrito: <span id="cart-count" class="badge bg-white text-dark ms-1">0</span> items
            </button>
        </header>

        <div class="container-fluid px-2 px-sm-3 mt-3">
        <div class="row g-3 g-lg-4" id="productos-container" data-tipo="inicio"></div>
            
            <!-- CONTENEDOR DINÁMICO -->
            <div class="row g-3 g-lg-4 mb-4" id="productos-container"></div>

            <!-- TARJETAS ESTÁTICAS HORIZONTALES -->
            <div class="row g-4">
                <!-- BLOQUE IZQUIERDO -->
                <div class="col-12 col-lg-6">
                    <h4 class="mb-3 text-center">🔥 Productos Destacados</h4>
                    <div class="d-flex flex-column gap-3">
                        
                        <!-- Tarjeta 1 -->
                        <div class="card card-horizontal">
                            <div class="row g-0 align-items-center">
                                <div class="col-4">
                                    <img src="filtros.jpg" class="img-fluid rounded-start img-horizontal" alt="Filtro">
                                </div>
                                <div class="col-8">
                                    <div class="card-body py-2 px-3 d-flex flex-column justify-content-between">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h5 class="card-title m-0 fs-6 fw-bold">Filtro de Aceite</h5>
                                            <span class="fw-bold text-success">$250</span>
                                        </div>
                                        <div class="cantidad-container my-1">
                                            <label for="cant-1" class="me-1 small">Cant:</label>
                                            <select id="cant-1" class="form-select form-select-sm d-inline-block w-auto">
                                                <option value="1">1</option>
                                                <option value="2">2</option>
                                            </select>
                                        </div>
                                        <div class="d-flex gap-2 mt-1">
                                            <button class="btn btn-primary btn-sm flex-fill" onclick="agregarAlCarrito(1, 'Filtro de Aceite', 250)">🛒 Agregar</button>
                                            <button class="btn btn-success btn-sm flex-fill" onclick="comprarAhora(1, 'Filtro de Aceite', 250)">⚡ Comprar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tarjeta 2 -->
                        <div class="card card-horizontal">
                            <div class="row g-0 align-items-center">
                                <div class="col-4">
                                    <img src="llantas.jpg" class="img-fluid rounded-start img-horizontal" alt="Llantas">
                                </div>
                                <div class="col-8">
                                    <div class="card-body py-2 px-3 d-flex flex-column justify-content-between">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h5 class="card-title m-0 fs-6 fw-bold">Juego de Llantas</h5>
                                            <span class="fw-bold text-success">$1,200</span>
                                        </div>
                                        <div class="cantidad-container my-1">
                                            <label for="cant-2" class="me-1 small">Cant:</label>
                                            <select id="cant-2" class="form-select form-select-sm d-inline-block w-auto">
                                                <option value="1">1</option>
                                                <option value="2">2</option>
                                            </select>
                                        </div>
                                        <div class="d-flex gap-2 mt-1">
                                            <button class="btn btn-primary btn-sm flex-fill" onclick="agregarAlCarrito(2, 'Juego de Llantas', 1200)">🛒 Agregar</button>
                                            <button class="btn btn-success btn-sm flex-fill" onclick="comprarAhora(2, 'Juego de Llantas', 1200)">⚡ Comprar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- BLOQUE DERECHO -->
                <div class="col-12 col-lg-6">
                    <h4 class="mb-3 text-center">⚡ Ofertas Especiales</h4>
                    <div class="d-flex flex-column gap-3">
                        
                        <!-- Tarjeta 3 -->
                        <div class="card card-horizontal">
                            <div class="row g-0 align-items-center">
                                <div class="col-4">
                                    <img src="camara.jpg" class="img-fluid rounded-start img-horizontal" alt="Dash Cam">
                                </div>
                                <div class="col-8">
                                    <div class="card-body py-2 px-3 d-flex flex-column justify-content-between">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h5 class="card-title m-0 fs-6 fw-bold">Dash Cam HD</h5>
                                            <span class="fw-bold text-success">$850</span>
                                        </div>
                                        <div class="cantidad-container my-1">
                                            <label for="cant-3" class="me-1 small">Cant:</label>
                                            <select id="cant-3" class="form-select form-select-sm d-inline-block w-auto">
                                                <option value="1">1</option>
                                                <option value="2">2</option>
                                            </select>
                                        </div>
                                        <div class="d-flex gap-2 mt-1">
                                            <button class="btn btn-primary btn-sm flex-fill" onclick="agregarAlCarrito(3, 'Dash Cam HD', 850)">🛒 Agregar</button>
                                            <button class="btn btn-success btn-sm flex-fill" onclick="comprarAhora(3, 'Dash Cam HD', 850)">⚡ Comprar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Tarjeta 4 -->
                        <div class="card card-horizontal">
                            <div class="row g-0 align-items-center">
                                <div class="col-4">
                                    <img src="bateria.jpg" class="img-fluid rounded-start img-horizontal" alt="Batería">
                                </div>
                                <div class="col-8">
                                    <div class="card-body py-2 px-3 d-flex flex-column justify-content-between">
                                        <div class="d-flex justify-content-between align-items-center">
                                            <h5 class="card-title m-0 fs-6 fw-bold">Batería 12V</h5>
                                            <span class="fw-bold text-success">$950</span>
                                        </div>
                                        <div class="cantidad-container my-1">
                                            <label for="cant-4" class="me-1 small">Cant:</label>
                                            <select id="cant-4" class="form-select form-select-sm d-inline-block w-auto">
                                                <option value="1">1</option>
                                                <option value="2">2</option>
                                            </select>
                                        </div>
                                        <div class="d-flex gap-2 mt-1">
                                            <button class="btn btn-primary btn-sm flex-fill" onclick="agregarAlCarrito(4, 'Batería 12V', 950)">🛒 Agregar</button>
                                            <button class="btn btn-success btn-sm flex-fill" onclick="comprarAhora(4, 'Batería 12V', 950)">⚡ Comprar</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- MODAL CARRITO Y PAGO (CENTRADO Y OCULTO POR DEFECTO) -->
    <div id="modal-carrito" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="d-flex justify-content-between align-items-center pb-2 border-bottom">
                <h3 class="m-0">🛒 Mi Carrito</h3>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" onclick="vaciarCarrito()" class="btn btn-sm btn-outline-danger">Vaciar Carrito</button>
                    <button type="button" class="btn-close" onclick="cerrarModal('modal-carrito')"></button>
                </div>
            </div>
            
            <div id="cart-items-container" class="my-3"></div>
            <h4 class="text-end fw-bold mb-3">Total: $<span id="cart-total">0.00</span> MXN</h4>
            
            <hr class="my-3">

            <h4 class="mb-3">💳 Proceso Bancario</h4>
            <form onsubmit="procesarPago(event)">
                <div class="mb-2">
                    <label class="form-label mb-1" style="font-size:0.9rem;">Nombre en la tarjeta:</label>
                    <input type="text" id="pago-nombre" class="form-control" required placeholder="Juan Pérez">
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1" style="font-size:0.9rem;">Número de Tarjeta (16 dígitos):</label>
                    <input type="text" id="pago-tarjeta" class="form-control" maxlength="16" required placeholder="1234567890123456">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label mb-1" style="font-size:0.9rem;">Vencimiento:</label>
                        <input type="text" class="form-control" placeholder="MM/AA" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label mb-1" style="font-size:0.9rem;">CVV:</label>
                        <input type="password" class="form-control" maxlength="3" required placeholder="123">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary flex-fill" onclick="cerrarModal('modal-carrito')">Cancelar</button>
                    <button type="submit" class="btn btn-success flex-fill fw-bold">Pagar y Generar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TICKET (CENTRADO Y OCULTO POR DEFECTO) -->
    <div id="modal-ticket" class="modal-overlay" style="display: none;">
        <div class="modal-content text-center" style="max-width: 450px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 text-success">✅ Transacción Exitosa</h4>
                <button type="button" class="btn-close" onclick="cerrarModal('modal-ticket')"></button>
            </div>
            
            <div id="ticket-contenido" class="ticket-box text-start p-3 bg-light rounded border mb-3"></div>
            
            <div class="d-flex gap-2">
                <button type="button" onclick="window.print()" class="btn flex-fill text-white" style="background-color: #6366f1;">🖨️ Descargar / Imprimir</button>
                <button type="button" onclick="cerrarModal('modal-ticket')" class="btn btn-secondary flex-fill">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
