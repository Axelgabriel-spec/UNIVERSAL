<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refacciones - UNIVERSAL</title>
    <link rel="icon" type="image/png" href="autopartes.png">
    
    <!-- Bootstrap 5 CSS y Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- BARRA SUPERIOR MÓVIL / NAVBAR RESPONSIVE -->
    <nav class="navbar navbar-dark bg-dark w-100 px-3 sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center p-0">
            <button class="btn text-white p-0 border-0" id="toggle-menu" type="button" onclick="toggleMenu()">
                <i class="bi bi-list fs-2"></i> ☰
            </button>

            <a class="navbar-brand m-0 fw-bold" href="index.html">
                UNIVERSAL
            </a>

            <button class="btn btn-warning fw-bold d-flex align-items-center gap-1 shadow-sm" onclick="abrirCarrito()">
                🛒 <span id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <!-- OVERLAY MÓVIL -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMenu()"></div>

    <!-- MENÚ / SIDEBAR PRINCIPAL -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header d-flex justify-content-between align-items-center p-3">
            <h2 class="m-0">UNIVERSAL</h2>
            <button class="btn-close-sidebar border-0 bg-transparent text-white fs-4" id="close-menu" onclick="toggleMenu()">✕</button>
        </div>
        <nav class="d-flex flex-column p-3">
            <a href="index.html" class="py-2 text-decoration-none">Inicio</a>
            <a href="refacciones.html" class="active py-2 text-decoration-none">Refacciones</a>
            <a href="autos.html" class="py-2 text-decoration-none">Autos</a>
            <a href="accesorios.html" class="py-2 text-decoration-none">Accesorios</a>
        </nav>

        <div class="d-flex align-items-center justify-content-center p-3">
            <img src="autopartes.png" alt="Autopartes Universal Logo" style="width: 100%; max-width: 250px; height: auto; object-fit: contain;">
        </div>
    </aside>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="container-fluid px-2 py-3">
        <header class="header-top d-flex align-items-center justify-content-between mb-4">
            <h2 id="categoria-titulo" class="m-0 fs-3">⚙️ Sección de Refacciones</h2>
        </header>

        <!-- CONTENEDOR DINÁMICO DONDE APP.JS CARGA LAS REFACCIONES -->
        <div id="productos-container" data-tipo="refacciones" class="row g-3 g-lg-4 justify-content-center mb-4">
            <!-- Se genera dinámicamente con App.js -->
        </div>
    </main>

    <!-- MODAL CARRITO Y PAGO -->
    <div id="modal-carrito" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="d-flex justify-content-between align-items-center pb-2 border-bottom">
                <h3 class="m-0">🛒 Mi Carrito</h3>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" onclick="vaciarCarrito()" class="btn btn-sm btn-outline-danger">Vaciar Carrito</button>
                    <button type="button" class="btn-close" onclick="cerrarModal('modal-carrito')"></button>
                </div>
            </div>
            
            <div id="cart-items-container" class="my-3"></div>
            <h4 class="text-end fw-bold mb-3">Total: $<span id="cart-total">0.00</span> MXN</h4>
            
            <hr class="my-3">

            <h4 class="mb-3">💳 Proceso Bancario</h4>
            <form onsubmit="procesarPago(event)">
                <div class="mb-2">
                    <label class="form-label mb-1" style="font-size:0.9rem;">Nombre en la tarjeta:</label>
                    <input type="text" id="pago-nombre" class="form-control" required placeholder="Juan Pérez">
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1" style="font-size:0.9rem;">Número de Tarjeta (16 dígitos):</label>
                    <input type="text" id="pago-tarjeta" class="form-control" maxlength="16" required placeholder="1234567890123456">
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label mb-1" style="font-size:0.9rem;">Vencimiento:</label>
                        <input type="text" class="form-control" placeholder="MM/AA" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label mb-1" style="font-size:0.9rem;">CVV:</label>
                        <input type="password" class="form-control" maxlength="3" required placeholder="123">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-secondary flex-fill" onclick="cerrarModal('modal-carrito')">Cancelar</button>
                    <button type="submit" class="btn btn-success flex-fill fw-bold">Pagar y Generar Ticket</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL TICKET -->
    <div id="modal-ticket" class="modal-overlay" style="display: none;">
        <div class="modal-content text-center" style="max-width: 450px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="m-0 text-success">✅ Transacción Exitosa</h4>
                <button type="button" class="btn-close" onclick="cerrarModal('modal-ticket')"></button>
            </div>
            
            <div id="ticket-contenido" class="ticket-box text-start p-3 bg-light rounded border mb-3"></div>
            
            <div class="d-flex gap-2">
                <button type="button" onclick="window.print()" class="btn flex-fill text-white" style="background-color: #6366f1;">🖨️ Descargar / Imprimir</button>
                <button type="button" onclick="cerrarModal('modal-ticket')" class="btn btn-secondary flex-fill">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle y App.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="App.js"></script>
</body>
</html>
